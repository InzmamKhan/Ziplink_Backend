# ===================================================================
# ZipLink Backend Configuration
# ===================================================================
spring.application.name=ziplink-backend

# Server Configuration
server.port=${PORT:8080}

# ===================================================================
# Database Configuration (Supabase PostgreSQL)
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ziplink}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===================================================================
# Redis Configuration (Upstash Redis)
# ===================================================================
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${SPRING_REDIS_SSL_ENABLED:true}

# ===================================================================
# Custom App Properties (CORS & Base Domain)
# ===================================================================
# Frontend Origin allowed for CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Base URL for generated short links
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Rate Limiting Configuration (Requests per minute per IP)
app.rate-limit.capacity=100
app.rate-limit.refill-rate=1.66